version: '3.9'

services:
  mc-server:
    build: .
    container_name: mc-server

    ports:
      - "${PORT}:25565"

    volumes:
      - ./data:/data

    environment:
      EULA: ${EULA}
      XMX: ${XMX}
      XMS: ${XMS}
      ENABLE_QUERY: ${ENABLE_QUERY}
      QUERY_PORT: ${QUERY_PORT}

    stdin_open: true
    tty: true

    restart: unless-stopped
